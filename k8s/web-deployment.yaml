apiVersion: apps/v1
kind: Deployment

metadata:
  name: web-server

spec:
  replicas: 1

  selector:
    matchLabels:
      app: web-server

  template:
    metadata:
      labels:
        app: web-server

    spec:
      containers:
        - name: web-server

          image: 438281141060.dkr.ecr.ap-southeast-1.amazonaws.com/lms-fe:1
          imagePullPolicy: Always

          ports:
            - containerPort: 80
